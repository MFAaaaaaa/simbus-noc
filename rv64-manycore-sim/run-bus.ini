[run]
build_dir = build
timeout_seconds = 180
[common]
cores = 4
tohost = 0x80001000
link-width = 4
route-latency = 3
router-buffer = 2
receive-slots = 16
memory-latency = 1
memory-queue = 64
max-ticks = 2000000
lat-alu = 1
lat-mul = 3
lat-div = 18
lat-branch = 1
lat-csr = 1
lat-memory = 1
lat-fence = 1
lat-vconfig = 1
lat-valu = 4
lat-vtransaction = 1
timing-table = isa-timing.ini
interconnect = shared
bus-arbitration = rr
bus-address-cycles = 1
bus-data-cycles = 3
bus-queue = 64
mmio-depth = 8
[private]
program = vector_stream_private.bin
[hotspot]
program = vector_stream_hotspot.bin
[compute]
program = vector_stream_gap.bin
[mmio]
program = mmio_bus_smoke.bin
mmio-depth = 1
[sweep]
cores = 1,2,4,8
