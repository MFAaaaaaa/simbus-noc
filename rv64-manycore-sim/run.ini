# 日常实验统一在这个文件改参数。无需修改 C++ 或重新编译。
# 命令：python3 run.py private / hotspot / compute / mmio / all / sweep

[run]
# 路径相对于 run.py 所在目录
build_dir = build
# 每个场景的宿主机运行超时（秒），与模拟 max-ticks 不同
timeout_seconds = 180

[common]
# 默认核心数量；命令行 --cores 可以临时覆盖
cores = 4
# 裸机程序结束上报地址
tohost = 0x80001000
# NoC：链路字节宽度、路由延迟、转发缓冲、目的端完整消息额度
link-width = 4
route-latency = 3
router-buffer = 2
receive-slots = 2
# 内存：服务周期、请求队列容量
memory-latency = 8
memory-queue = 2
max-ticks = 2000000
# 固定指令执行等待周期
lat-alu = 1
lat-mul = 3
lat-div = 18
lat-branch = 1
lat-csr = 1
lat-memory = 1
lat-fence = 1
lat-vconfig = 1
lat-valu = 4
lat-vtransaction = 1

# 场景继承 common，下面可以写同名参数覆盖公共值
[private]
program = vector_stream_private.bin

[hotspot]
program = vector_stream_hotspot.bin

[compute]
program = vector_stream_gap.bin

[mmio]
program = mmio_bus_smoke.bin
receive-slots = 1
memory-latency = 100
memory-queue = 1

[sweep]
# sweep只扫描private/hotspot/compute三个场景
cores = 1, 2, 4, 8
